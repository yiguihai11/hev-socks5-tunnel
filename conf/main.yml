# Main configuration for hev-socks5-tunnel

tunnel:
  # Interface name
  name: tun0
  # Interface MTU
  mtu: 1500
  # Multi-queue
  multi-queue: false
  # IPv4 address
  ipv4: 198.18.0.1
  # IPv6 address
  ipv6: 'fc00::1'
  # Post up script
# post-up-script: up.sh
  # Pre down script
# pre-down-script: down.sh

socks5:
  # SOCKS5 server for TCP connections
  tcp:
    # Socks5 server port
    port: 1080
    # Socks5 server address (ipv4/ipv6)
    address: 64.69.34.166
    # Socks5 handshake using pipeline mode
#   pipeline: false
    # Socks5 server username
    username: 'yiguihai'
    # Socks5 server password
    password: 'ygh15177542493'
    # Socket mark
#   mark: 123
  
  # SOCKS5 server for UDP connections (独立配置)
  udp:
    # ✅ UDP连接现在使用独立的配置，不再依赖TCP块！
    # 无论udp-relay模式如何，都会使用本块中定义的地址、端口和认证信息。

    # Socks5 server address (UDP连接专用)
    address: 64.69.34.166
    # Socks5 server port (UDP连接专用)
    port: 1080

    # Socks5 UDP relay mode (传输方式选择):
    #   'tcp' - UDP-in-TCP模式(推荐):
    #           • UDP数据被封装在TCP连接中发送
    #           • 使用本块中定义的地址和端口(64.69.34.166:1080)
    #           • 使用本块中定义的用户名和密码进行认证
    #           • 稳定可靠，能穿越NAT和防火墙
    #
    #   'udp' - UDP-in-UDP模式:
    #           • 直接UDP转发，性能稍好但可能受NAT影响
    #           • 同样使用本块中定义的地址、端口和认证信息
    #           • 需要SOCKS5服务器在指定地址和端口上监听UDP
    udp-relay: 'udp'

    # 认证信息 (UDP连接专用，独立配置)
    username: 'yiguihai'
    password: 'ygh15177542493'

    # Socket mark (UDP连接专用)
#   mark: 456

dns-forwarder:
  # Enable DNS forwarder feature (default: false)
  # When enabled, DNS queries to virtual-ip are redirected to target-ip
  enabled: false

  # Hijack DNS queries sent to this IPv4 address inside the tunnel.
  virtual-ip4: 8.8.8.8
  # Hijack DNS queries sent to this IPv6 address inside the tunnel.
  virtual-ip6: '2001:4860:4860::8844'

  # Forward IPv4 DNS queries to this target.
  # Port is optional, defaults to 53.
  target-ip4: 127.0.0.1:1053
  # target-ip4: 1.1.1.1:53

  # Forward IPv6 DNS queries to this target.
  # Port is optional, defaults to 53.
  # target-ip6: '[2606:4700:4700::1111]'
  target-ip6: '[2606:4700:4700::1111]:53'

dns-split-tunnel:
  # 启用 DNS 分流功能 (default: false)
  enabled: true

  # 国外 DNS 服务器列表（自动分类 IPv4/IPv6）
  # 当查询国内 DNS (如 119.29.29.29) 检测到污染时，
  # 会根据原 DNS 服务器的协议类型选择对应协议的国外 DNS 重新查询
  foreign-dns:
    - "1.1.1.1"              # Cloudflare DNS (IPv4)
    - "8.8.8.8"              # Google DNS (IPv4)
    - "2606:4700:4700::1111" # Cloudflare DNS (IPv6)
    - "2001:4860:4860::8888" # Google DNS (IPv6)

# DNS 延迟优化功能（NEW）
# 当干净的 DNS 响应包含多个 IP 时，自动测速并选择延迟最低的 IP
dns-latency-optimize:
  # 启用 DNS 延迟优化（默认禁用）
  enabled: true

  # 总测速超时时间（毫秒）
  # 如果所有 IP 测速都超时，将返回原始 DNS 响应
  timeout-ms: 250

chnroutes:
  # Enables split routing based on a list of Chinese IP ranges.
  # When enabled, traffic to IPs within the specified file will be considered "domestic".
  # This allows for different routing decisions, e.g., domestic traffic can be connected
  # directly, while other traffic goes through the SOCKS5 proxy.
  enabled: true
  # Path to the chnroutes file containing Chinese IP ranges.
  file-path: "conf/chnroutes.txt"

smart-proxy:
  # Enable smart-proxy feature (default: false)
  # When enabled, provides intelligent fallback for non-domestic TCP traffic:
  # 1. First tries direct connection
  # 2. If timeout, falls back to SOCKS5 proxy
  # 3. Temporarily blocks slow IPs for future connections
  enabled: true

  # Enables a "smart" fallback mechanism for non-domestic TCP traffic.
  # When a TCP connection to a non-domestic IP is attempted:
  # 1. It first tries to connect directly.
  # 2. If the direct connection attempt times out (takes longer than `timeout-ms`),
  #    it will then fall back to using the SOCKS5 proxy for that connection.
  # 3. The IP address that timed out is temporarily "blocked" for a duration of
  #    `blocked-ip-expiry-minutes`.
  # 4. Future connection attempts to a blocked IP will skip the direct attempt and
  #    go straight to the SOCKS5 proxy, improving performance for slow-to-reach sites.
  #
  # Feature is enabled if both timeout-ms and blocked-ip-expiry-minutes are set and non-zero.

  # Timeout in milliseconds for direct connection attempts.
  timeout-ms: 1400
  # Expiry time in minutes for temporarily blocked IPs.
  blocked-ip-expiry-minutes: 360

  # List of ports to enable protocol detection (TLS SNI / HTTP Host)
  # Only connections to these ports will trigger smart-proxy probe.
  # Common ports: 80 (HTTP), 443 (HTTPS), 8080 (HTTP Alt), 8443 (HTTPS Alt)
  probe-ports:
    - 80
    - 443

acl:
  # Enable ACL feature (default: false)
  # When enabled, blocks IP addresses and hostnames/SNI listed in the ACL file
  enabled: true

  # Path to the ACL file containing IP addresses and hostnames/SNI to block.
  # Each line in the file can be an IP address (IPv4 or IPv6) or a hostname/SNI.
  # Lines starting with '#' are treated as comments.
  file-path: "conf/acl.txt"

mapdns:
  # Mapped DNS listen address (IPv4, optional)
  address: 198.18.0.2
  # Mapped DNS listen address (IPv6, optional, for pure IPv6 environment)
  address6: 'fd00::1'
  # Mapped DNS port
  port: 53
  # Mapped IP network base (IPv4)
  network: 240.0.0.0
  # Mapped IP network mask (IPv4)
  netmask: 240.0.0.0
  # Mapped IP network prefix (IPv6, optional, default: fd00::)
  network6: 'fd00::'
  # IPv6 prefix length (optional, default: 96)
  # /96 = 32-bit index (4.2B entries)
  # /112 = 16-bit index (65K entries)
  # /120 = 8-bit index (256 entries)
  prefixlen: 96
  # Mapped DNS cache size
  cache-size: 10000

misc:
  # task stack size (bytes)
  task-stack-size: 81920
  # tcp buffer size (bytes)
  tcp-buffer-size: 65536
  # udp socket recv buffer (SO_RCVBUF) size (bytes)
  udp-recv-buffer-size: 524288
  # number of udp buffers in splice, 1500 bytes per buffer.
  udp-copy-buffer-nums: 10
  # maximum session count (0: unlimited)
  max-session-count: 0
  # connect timeout (ms)
  connect-timeout: 10000
  # TCP read-write timeout (ms)
  tcp-read-write-timeout: 300000
  # UDP read-write timeout (ms)
  udp-read-write-timeout: 5000
  # stdout, stderr or file-path
  log-file: stdout
  # debug, info, warn or error
  log-level: debug
  # If present, run as a daemon with this pid file
# pid-file: /run/hev-socks5-tunnel.pid
  # If present, set rlimit nofile; else use default value
# limit-nofile: 65535
